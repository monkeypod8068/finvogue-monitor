<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マーケット・ストレス・モニター | FinVogue</title>
<style>
:root{
  --bg:#fbfaf7; --card:#ffffff; --ink:#1c1b19; --muted:#6d6a63; --line:#e7e3da;
  --s0:#2f7a52; --s0bg:#e8f3ec; --s1:#9a6b00; --s1bg:#fbf1d6;
  --s2:#b4441e; --s2bg:#fbe7df; --s3:#ffffff; --s3bg:#7a1414;
  --on:#b4441e; --onbg:#fbe7df; --good:#2f7a52; --goodbg:#e8f3ec;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151513; --card:#1e1d1b; --ink:#edebe6; --muted:#a19d95; --line:#33312d;
  --s0:#7fd1a3; --s0bg:#1b2d22; --s1:#f0c45a; --s1bg:#33290f; --s2:#ff9a77; --s2bg:#3a1c13;
  --s3bg:#a3221b; --on:#ff9a77; --onbg:#3a1c13; --good:#7fd1a3; --goodbg:#1b2d22;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:22px 16px 40px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:8px}
h1{font-size:19px;margin:0;letter-spacing:.04em}
.meta{font-size:12.5px;color:var(--muted)}
.stage{margin:18px 0 6px;border-radius:12px;padding:16px 18px}
.stage .lv{font-size:13px;font-weight:600;letter-spacing:.08em}
.stage .name{font-size:24px;font-weight:700;margin:2px 0 4px}
.stage .head{font-size:15px}
.st0{background:var(--s0bg);color:var(--s0)} .st1{background:var(--s1bg);color:var(--s1)}
.st2{background:var(--s2bg);color:var(--s2)} .st3{background:var(--s3bg);color:var(--s3)}
.stage .head{color:var(--ink)} .st3 .head{color:#fff}
.scale{display:flex;gap:4px;margin:10px 0 0}
.scale span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.scale span.f{background:currentColor}
h2{font-size:15px;margin:28px 0 10px;padding-left:9px;border-left:4px solid var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.analysis p{margin:0 0 .8em} .analysis ul{margin:.2em 0 .8em;padding-left:1.3em}
.analysis h3{font-size:14.5px;margin:1em 0 .3em}
.analysis a{color:inherit}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:none}
.dist{white-space:nowrap;font-weight:600}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.grp h3{font-size:13px;margin:0 0 6px;color:var(--muted);font-weight:600}
.sig{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:3px 0}
.dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:.55em;background:var(--line)}
.sig.on .dot{background:var(--on)} .sig.on{font-weight:600}
.grp.positive .sig.on .dot{background:var(--good)}
.sig.off{color:var(--muted)}
.src{font-size:12.5px;color:var(--muted)} .src a{color:inherit}
.note{font-size:12px;color:var(--muted);margin-top:26px;border-top:1px solid var(--line);padding-top:10px}
.err{color:var(--muted);padding:30px 0;text-align:center}
.tabs{display:flex;gap:4px;margin:14px 0 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a{padding:8px 14px;font-size:14px;color:var(--muted);text-decoration:none;white-space:nowrap;
  border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a.cur{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.rep-meta{font-size:12px;color:var(--muted);margin:12px 0 0}
.rep-meta a{color:inherit}
.report-host{display:block;margin:0 -16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>マーケット・ストレス・モニター</h1>
    <div class="meta" id="meta">読み込み中…</div>
  </header>
  <nav class="tabs" id="tabs">
    <a href="#analysis" data-tab="analysis">分析</a>
    <a href="#morning" data-tab="morning">朝版レポート</a>
    <a href="#evening" data-tab="evening">夕方版レポート</a>
  </nav>
  <div id="app"><div class="err">データを読み込んでいます…</div></div>
  <div id="report" hidden></div>
  <div class="note">
    S&amp;P500・半導体・ボラティリティ・クレジット・日本株の動きを機械的に判定し、その日の材料とあわせて整理したものです。
    投資判断はご自身の責任で行ってください。本ページは投資助言ではありません。
  </div>
</div>
<script>
(function(){
  var STAGES=["平常","注意(調整)","調整拡大","暴落型"];
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  // 分析本文は限られたタグだけを通す(<p><ul><li><b><strong><h3><br><a href>)
  function safeHtml(h){
    var t=document.createElement("template"); t.innerHTML=String(h||"");
    var ok={P:1,UL:1,OL:1,LI:1,B:1,STRONG:1,EM:1,H3:1,BR:1,A:1,SPAN:1};
    (function walk(n){
      Array.prototype.slice.call(n.childNodes).forEach(function(c){
        if(c.nodeType===1){
          if(!ok[c.tagName]){c.replaceWith(document.createTextNode(c.textContent));return;}
          Array.prototype.slice.call(c.attributes).forEach(function(a){
            if(!(c.tagName==="A"&&a.name==="href"&&/^https?:\/\//.test(a.value))) c.removeAttribute(a.name);});
          if(c.tagName==="A"){c.setAttribute("target","_blank");c.setAttribute("rel","noopener");}
          walk(c);
        }
      });
    })(t.content);
    var d=document.createElement("div"); d.appendChild(t.content); return d.innerHTML;
  }
  function render(d){
    var s=Math.max(0,Math.min(3,d.stage|0));
    document.getElementById("meta").textContent=
      "更新 "+(d.updated||"")+(d.edition?"（"+d.edition+"）":"")+(d.us_date?" ／ 米国の基準日 "+d.us_date:"");
    var h=[];
    h.push('<section class="stage st'+s+'"><div class="lv">現在の判定　段階 '+s+' / 3</div>'+
      '<div class="name">'+esc(d.stage_label||STAGES[s])+'</div>'+
      '<div class="head">'+esc(d.headline)+'</div>'+
      '<div class="scale">'+[0,1,2,3].map(function(i){return '<span class="'+(i<=s?"f":"")+'"></span>';}).join("")+'</div></section>');
    if(d.analysis_html){h.push('<h2>今日の見方</h2><div class="card analysis">'+safeHtml(d.analysis_html)+'</div>');}
    if(d.checkpoints&&d.checkpoints.length){
      h.push('<h2>次の分岐点</h2><div class="card"><table><thead><tr><th>見ているもの</th><th>距離</th><th>超えたら</th></tr></thead><tbody>'+
        d.checkpoints.map(function(c){return '<tr><td>'+esc(c.label)+'</td><td class="dist">'+esc(c.distance)+'</td><td>'+esc(c.meaning)+'</td></tr>';}).join("")+
        '</tbody></table></div>');
    }
    if(d.signal_groups&&d.signal_groups.length){
      h.push('<h2>シグナルの点灯状況</h2><div class="groups">'+d.signal_groups.map(function(g){
        return '<div class="card grp'+(g.positive?" positive":"")+'"><h3>'+esc(g.name)+'</h3>'+
          (g.signals||[]).map(function(x){return '<div class="sig '+(x.on?"on":"off")+'"><span class="dot"></span><span>'+esc(x.label)+'</span></div>';}).join("")+'</div>';
      }).join("")+'</div>');
    }
    if(d.sources&&d.sources.length){
      h.push('<h2>参考にしたニュース</h2><div class="card src">'+d.sources.map(function(x){
        return /^https?:\/\//.test(x.url||"")?'<div><a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.title)+'</a></div>':'<div>'+esc(x.title)+'</div>';
      }).join("")+'</div>');
    }
    document.getElementById("app").innerHTML=h.join("");
  }
  var DATA=null, metaText="";
  fetch("latest.json?t="+Date.now(),{cache:"no-store"})
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
    .then(function(d){DATA=d;render(d);metaText=document.getElementById("meta").textContent;show();})
    .catch(function(){document.getElementById("app").innerHTML='<div class="err">データを読み込めませんでした。時間をおいて再読み込みしてください。</div>';
      document.getElementById("meta").textContent="";show();});

  // ---- 元のHTMLレポート(朝版・夕方版)をページ内に表示する ----
  // iframeを入れ子にしないよう、Shadow DOMに読み込んでレポート側のCSSを閉じ込める
  var FILES={morning:"report_morning.html",evening:"report_evening.html"};
  var LABEL={morning:"朝版",evening:"夕方版"};
  var cache={};
  function loadReport(tab){
    var host=document.getElementById("report");
    host.innerHTML='<div class="err">レポートを読み込んでいます…</div>';
    var p=cache[tab]||fetch(FILES[tab]+"?t="+Date.now(),{cache:"no-store"}).then(function(r){
      if(!r.ok)throw new Error(r.status);return r.text();});
    cache[tab]=p;
    p.then(function(txt){
      var doc=new DOMParser().parseFromString(txt,"text/html");
      var css=Array.prototype.map.call(doc.querySelectorAll("style"),function(x){return x.textContent;}).join("\n")
        .replace(/:root/g,":host").replace(/(^|[}\s])body\s*\{/g,"$1.rbody{");
      doc.querySelectorAll("script,style,link").forEach(function(x){x.remove();});
      var title=(doc.querySelector("h1")||{}).textContent||"";
      host.innerHTML='<div class="rep-meta">'+esc(LABEL[tab])+'の元レポート'+
        ' ／ <a href="'+FILES[tab]+'" target="_blank" rel="noopener">別のタブで開く</a></div>';
      var box=document.createElement("div"); box.className="report-host"; host.appendChild(box);
      var root=box.attachShadow({mode:"open"});
      root.innerHTML="<style>"+css+"\n:host{display:block}</style><div class='rbody'>"+doc.body.innerHTML+"</div>";
      document.getElementById("meta").textContent=title.replace(/^.*?(\d+\/\d+)/,"$1");
    }).catch(function(){delete cache[tab];
      host.innerHTML='<div class="err">'+esc(LABEL[tab])+'のレポートを読み込めませんでした。</div>';});
  }
  function show(){
    var tab=(location.hash||"#analysis").slice(1); if(!FILES[tab]&&tab!=="analysis")tab="analysis";
    Array.prototype.forEach.call(document.querySelectorAll("#tabs a"),function(a){
      a.classList.toggle("cur",a.getAttribute("data-tab")===tab);});
    var app=document.getElementById("app"), rep=document.getElementById("report");
    if(tab==="analysis"){app.hidden=false;rep.hidden=true;document.getElementById("meta").textContent=metaText;}
    else{app.hidden=true;rep.hidden=false;loadReport(tab);}
  }
  window.addEventListener("hashchange",show);
})();
</script>
</body>
</html>
