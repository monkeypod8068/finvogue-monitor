<style>
:root{--bg:#fbfaf7;--card:#fff;--ink:#1c1b19;--muted:#6d6a63;--faint:#9c988f;--line:#e7e3da;--hover:#faf8f3;--accent:#6e1f1f;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;font-feature-settings:"palt"}
.wrap{max-width:860px;margin:0 auto;padding:6px 14px 24px}
/* 読み込み中にフッターが見えて動かないよう高さを確保（CLS対策） */
#app{min-height:100vh}
html.embed #app{min-height:0}
h2{font-size:15px;margin:22px 0 10px;padding-left:10px;border-left:4px solid var(--ink);line-height:1.4}
h2 .n{font-size:12px;color:var(--faint);font-weight:400;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
a.item{display:flex;flex-direction:column;gap:4px;padding:14px 16px 13px;background:var(--card);
  border:1px solid var(--line);border-radius:10px;color:inherit;text-decoration:none;position:relative;
  transition:border-color .15s,background .15s,transform .15s}
a.item:hover{border-color:var(--ink);background:var(--hover)}
a.item:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.top{display:flex;align-items:center;gap:8px}
.src{font-size:11px;letter-spacing:.03em;font-weight:600;color:var(--muted);white-space:nowrap}
.src::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px;opacity:.75}
.title{font-weight:700;font-size:15px;line-height:1.45;padding-right:18px}
.note{font-size:12.5px;color:var(--muted);line-height:1.6}
.ext{position:absolute;top:15px;right:14px;color:var(--faint)}
a.item:hover .ext{color:var(--ink)}
.foot{margin-top:20px;font-size:11.5px;color:var(--faint)}
.pg{max-width:860px;margin:0 auto;padding:22px 14px 0}
.pg h1{font-size:19px;margin:0;letter-spacing:.04em;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.pg p{font-size:13.5px;color:var(--muted);margin:10px 0 0}
html.embed .pg{display:none}
</style>
<script>if(/[?&]embed=1/.test(location.search))document.documentElement.classList.add("embed");</script>
</head>
<body>
<header class="site-hd"><div class="in"><a class="brand" href="index.html">FinVogue</a><nav class="site-nav" aria-label="サイト内メニュー"><a href="index.html"><span class="lg">マーケット・ストレス・</span>モニター</a><a href="links.html" aria-current="page"><span class="lg">マーケット・</span>ダッシュボード</a><a href="about.html">このページについて</a></nav></div></header>
<div class="pg"><h1>マーケット・ダッシュボード</h1><p>相場の状況を確認するときに見ている、市場心理・経済指標・需給のデータの一覧です。</p></div>
<div class="wrap" id="app"></div>
<footer class="site-ft"><span>© FinVogue　<a class="sns" href="https://x.com/finvogue_jp" target="_blank" rel="me noopener noreferrer">X（@finvogue_jp）</a>　<a class="sns" href="https://note.com/finvogue" target="_blank" rel="me noopener noreferrer">note</a></span><span>本サイトは情報提供を目的としたもので、投資助言ではありません。<a href="about.html#disclaimer">免責事項</a></span></footer>

<script>
(function(){
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function safeUrl(u){return /^https?:\/\//i.test(u||"")?u:"#";}
  var ICON='<svg class="ext" viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path d="M4.5 2.5h5v5M9.5 2.5 3 9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
  fetch("links.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json();}).then(function(d){
    var h=[];
    (d.groups||[]).forEach(function(g){
      h.push('<h2>'+esc(g.name)+'<span class="n">'+(g.items||[]).length+'</span></h2><div class="grid">');
      (g.items||[]).forEach(function(it){
        h.push('<a class="item" href="'+esc(safeUrl(it.url))+'" target="_blank" rel="noopener noreferrer">'+ICON+
          '<div class="top"><span class="src">'+esc(it.source||"")+'</span></div>'+
          '<div class="title">'+esc(it.title)+'</div>'+
          (it.note?'<div class="note">'+esc(it.note)+'</div>':'')+'</a>');
      });
      h.push('</div>');
    });
    h.push('<p class="foot">外部サイトに移動します。各サイトの内容は、それぞれの運営元の責任で提供されています。</p>');
    document.getElementById("app").innerHTML=h.join("");
  }).catch(function(){document.getElementById("app").textContent="リンクを読み込めませんでした。";});
})();
</script>
