name: og-image
# latest.json が更新されたら、Xのカード用画像(og/)と日付ページ(d/)を作る
on:
  push:
    branches: [main]
    paths: [latest.json]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: og-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install fonts and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          ls /usr/share/fonts/opentype/noto/ || true
          pip install -q pillow
      - name: Render
        run: python scripts/make_og.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og d
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "og画像 $(date -u +%Y-%m-%dT%H:%M)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
      - name: Rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
